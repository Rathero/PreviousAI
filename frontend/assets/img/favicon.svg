<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Previous AI">
  <rect width="64" height="64" fill="#F5F5F5"/>
  <!-- The mark: two chevrons pointing back, for "previous". Each arm is a wedge, thick at
       the open end and thin at the point, cut straight down at the right; the pair is
       drawn once and used twice so both stay identical. -->
  <defs>
    <path id="pv-chevron" d="M32.5 21.3 10.1 29.1 10.1 34.9 32.5 42.7 32.5 36.5 13.7 32 32.5 27.5Z"/>
  </defs>
  <g fill="#080808" stroke="#080808" stroke-width="0.9" stroke-linejoin="round">
    <use href="#pv-chevron"/>
    <use href="#pv-chevron" x="21.9"/>
  </g>
</svg>
